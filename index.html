<!-- SELECTOR DE IDIOMA EN EL HEADER -->
<div class="relative flex items-center">
  <select id="languageSelector" onchange="cambiarIdiomaGoogle(this.value)" 
    class="bg-slate-900 border border-slate-800 text-slate-200 text-xs font-semibold rounded-full px-3 py-1.5 outline-none focus:border-teal-400 cursor-pointer">
    <option value="es" selected>🇲🇽 ES</option>
    <option value="en">🇺🇸 EN</option>
    <option value="fr">🇫🇷 FR</option>
    <option value="de">🇩🇪 DE</option>
  </select>
</div>

<!-- CONTENEDOR OCULTO DE GOOGLE TRANSLATE -->
<div id="google_translate_element" class="hidden"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,es,fr,de',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function cambiarIdiomaGoogle(lang) {
    const select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = lang;
      select.dispatchEvent(new Event('change'));
    }
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
